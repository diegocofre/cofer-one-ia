name: Apply v0.3.2 Anthropic fix

on:
  push:
    branches:
      - agent/v0.3.2-anthropic-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply v0.3.2 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{path}: expected one match, found {count}'
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Claude Code: use the documented boolean spelling used by third-party gateway guidance.
          replace_once(
              'collama/collama_launch.py',
              '"ENABLE_TOOL_SEARCH": "0",',
              '"ENABLE_TOOL_SEARCH": "false",',
          )

          # Do not forward Anthropic beta negotiation to non-Anthropic upstream providers.
          replace_once(
              'services/ollama-gateway/app/upstream.py',
              '_ROUTING_OVERRIDE_HEADERS = {\n    "x-headroom-base-url",\n    "x-litellm-api-key",\n}\n_RESPONSE_BLOCK_HEADERS',
              '_ROUTING_OVERRIDE_HEADERS = {\n    "x-headroom-base-url",\n    "x-litellm-api-key",\n}\n_UNSUPPORTED_PROTOCOL_HEADERS = {"anthropic-beta"}\n_RESPONSE_BLOCK_HEADERS',
          )
          replace_once(
              'services/ollama-gateway/app/upstream.py',
              '        if lowered in _ROUTING_OVERRIDE_HEADERS or lowered.startswith("x-headroom-"):\n            continue\n',
              '        if lowered in _ROUTING_OVERRIDE_HEADERS or lowered.startswith("x-headroom-"):\n            continue\n        if lowered in _UNSUPPORTED_PROTOCOL_HEADERS:\n            continue\n',
          )

          main_path = Path('services/ollama-gateway/app/main.py')
          main = main_path.read_text(encoding='utf-8')
          marker = 'async def _proxy_model_request(request: Request, path: str, *, bypass_headroom: bool = False) -> Response:\n'
          assert main.count(marker) == 1
          helpers = '''def _anthropic_error_type(status_code: int) -> str:\n    if status_code == 400 or status_code == 422:\n        return "invalid_request_error"\n    if status_code == 401:\n        return "authentication_error"\n    if status_code == 402:\n        return "billing_error"\n    if status_code == 403:\n        return "permission_error"\n    if status_code == 404:\n        return "not_found_error"\n    if status_code == 413:\n        return "request_too_large"\n    if status_code == 429:\n        return "rate_limit_error"\n    if status_code == 529:\n        return "overloaded_error"\n    return "api_error"\n\n\ndef _anthropic_error_message(response: Response) -> str:\n    body = getattr(response, "body", b"")\n    if isinstance(body, bytes):\n        text = body.decode("utf-8", errors="replace").strip()\n    else:\n        text = str(body or "").strip()\n    if not text:\n        return f"Upstream request failed with HTTP {response.status_code}"\n    try:\n        payload = json.loads(text)\n    except (json.JSONDecodeError, TypeError):\n        return text\n    if isinstance(payload, dict):\n        error = payload.get("error")\n        if isinstance(error, dict):\n            message = error.get("message")\n            if isinstance(message, str) and message.strip():\n                return message.strip()\n        if isinstance(error, str) and error.strip():\n            return error.strip()\n        detail = payload.get("detail")\n        if isinstance(detail, str) and detail.strip():\n            return detail.strip()\n    return text\n\n\ndef _normalize_anthropic_error(response: Response) -> Response:\n    if response.status_code < 400:\n        return response\n    headers = {\n        key: value\n        for key, value in response.headers.items()\n        if key.lower() not in {"content-length", "content-type"}\n    }\n    return JSONResponse(\n        status_code=response.status_code,\n        content={\n            "type": "error",\n            "error": {\n                "type": _anthropic_error_type(response.status_code),\n                "message": _anthropic_error_message(response),\n            },\n        },\n        headers=headers,\n    )\n\n\n'''
          main = main.replace(marker, helpers + marker, 1)

          old_proxy = '''    payload_transformer = None\n    extra_upstream_headers = None\n    anthropic_route = path in {"/v1/messages", "/v1/messages/count_tokens"}\n    model_rewriter = _anthropic_upstream_model_name if anthropic_route and not chatgpt_route else _upstream_model_name\n    if chatgpt_route:\n        upstream_base_url = settings.chatgpt_litellm_url\n        if anthropic_route:\n            payload_transformer = _chatgpt_compatible_anthropic_payload\n    elif bypass_headroom:\n        upstream_base_url = settings.litellm_url\n        if anthropic_route:\n            payload_transformer = _anthropic_main_compatible_payload\n    else:\n        upstream_base_url = settings.headroom_url\n        if path == "/v1/messages":\n            # Headroom receives Anthropic protocol traffic, but the model is\n            # rewritten to a dedicated LiteLLM chat-completions deployment.\n            # This avoids the newer Anthropic -> Responses tool bridge while\n            # preserving Headroom on normal providers.\n            extra_upstream_headers = {"x-headroom-base-url": settings.litellm_url}\n            payload_transformer = _anthropic_main_compatible_payload\n    return await proxy_json_request(\n        request,\n        path,\n        model_rewriter=model_rewriter,\n        payload_transformer=payload_transformer,\n        upstream_base_url=upstream_base_url,\n        include_internal_auth=not chatgpt_route,\n        extra_upstream_headers=extra_upstream_headers,\n    )\n'''
          new_proxy = '''    payload_transformer = None\n    anthropic_route = path in {"/v1/messages", "/v1/messages/count_tokens"}\n    model_rewriter = _anthropic_upstream_model_name if anthropic_route and not chatgpt_route else _upstream_model_name\n    if chatgpt_route:\n        upstream_base_url = settings.chatgpt_litellm_url\n        if anthropic_route:\n            payload_transformer = _chatgpt_compatible_anthropic_payload\n    elif anthropic_route or bypass_headroom:\n        # Claude's Anthropic surface is compatibility-sensitive. Keep Headroom\n        # off this path so ToolSearch/deferred-tool beta semantics cannot be\n        # reintroduced after the gateway has normalized the request.\n        upstream_base_url = settings.litellm_url\n        if anthropic_route:\n            payload_transformer = _anthropic_main_compatible_payload\n    else:\n        upstream_base_url = settings.headroom_url\n    response = await proxy_json_request(\n        request,\n        path,\n        model_rewriter=model_rewriter,\n        payload_transformer=payload_transformer,\n        upstream_base_url=upstream_base_url,\n        include_internal_auth=not chatgpt_route,\n    )\n    return _normalize_anthropic_error(response) if anthropic_route else response\n'''
          assert main.count(old_proxy) == 1, 'main.py proxy block drifted'
          main = main.replace(old_proxy, new_proxy, 1)
          main_path.write_text(main, encoding='utf-8')

          # Launcher contract.
          replace_once(
              'services/ollama-gateway/tests/test_collama_launch.py',
              'assert spec.env["ENABLE_TOOL_SEARCH"] == "0"',
              'assert spec.env["ENABLE_TOOL_SEARCH"] == "false"',
          )

          test_path = Path('services/ollama-gateway/tests/test_upstream_proxy.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    assert response.json() == {"error": "limited"}\n',
              '    assert response.json() == {"type": "error", "error": {"type": "rate_limit_error", "message": "limited"}}\n',
              1,
          )
          tests = tests.replace(
              '    assert call[1].startswith("http://headroom/")\n',
              '    assert call[1].startswith("http://litellm:4000/")\n',
              1,
          )
          tests = tests.replace(
              '    assert call[1].startswith("http://headroom/v1/messages")\n',
              '    assert call[1].startswith("http://litellm:4000/v1/messages")\n',
              1,
          )
          old_pin = '''async def test_anthropic_messages_pins_headroom_to_litellm_and_ignores_client_override(client):\n    FakeAsyncClient.response = FakeResponse()\n    response = await client.post(\n        "/v1/messages?beta=true",\n        json={"model": "phi4:14b", "messages": [{"role": "user", "content": "hello"}]},\n        headers={\n            "anthropic-version": "2023-06-01",\n            "x-headroom-base-url": "https://evil.example.invalid",\n            "authorization": "Bearer client-token",\n        },\n    )\n    assert response.status_code == 200\n    call = FakeAsyncClient.instances[-1].calls[0]\n    assert call[1].startswith("http://headroom/v1/messages")\n    assert call[2]["headers"]["x-headroom-base-url"] == "http://litellm:4000"\n    assert call[2]["headers"]["Authorization"] == "Bearer sk-internal"\n    assert call[2]["headers"]["anthropic-version"] == "2023-06-01"\n'''
          new_pin = '''async def test_anthropic_messages_bypass_headroom_and_strip_incompatible_beta_headers(client):\n    FakeAsyncClient.response = FakeResponse()\n    response = await client.post(\n        "/v1/messages?beta=true",\n        json={"model": "phi4:14b", "messages": [{"role": "user", "content": "hello"}]},\n        headers={\n            "anthropic-version": "2023-06-01",\n            "anthropic-beta": "advanced-tool-use-2025-11-20",\n            "x-headroom-base-url": "https://evil.example.invalid",\n            "authorization": "Bearer client-token",\n        },\n    )\n    assert response.status_code == 200\n    call = FakeAsyncClient.instances[-1].calls[0]\n    assert call[1].startswith("http://litellm:4000/v1/messages")\n    lowered = {key.lower() for key in call[2]["headers"]}\n    assert "x-headroom-base-url" not in lowered\n    assert "anthropic-beta" not in lowered\n    assert call[2]["headers"]["Authorization"] == "Bearer sk-internal"\n    assert call[2]["headers"]["anthropic-version"] == "2023-06-01"\n'''
          assert tests.count(old_pin) == 1, 'headroom test block drifted'
          tests = tests.replace(old_pin, new_pin, 1)

          # Strengthen the real ToolSearch route test with the beta header and direct-LiteLLM assertion.
          tests = tests.replace(
              '    response = await client.post("/v1/messages", json=payload)\n    assert response.status_code == 200\n    call = FakeAsyncClient.instances[-1].calls[0]\n    forwarded = __import__("json").loads(call[2]["content"])\n    assert forwarded["model"] == "cofer-anthropic--nvidia/nemotron-3-super-120b-a12b:free"\n',
              '    response = await client.post(\n        "/v1/messages",\n        json=payload,\n        headers={"anthropic-beta": "advanced-tool-use-2025-11-20"},\n    )\n    assert response.status_code == 200\n    call = FakeAsyncClient.instances[-1].calls[0]\n    forwarded = __import__("json").loads(call[2]["content"])\n    assert forwarded["model"] == "cofer-anthropic--nvidia/nemotron-3-super-120b-a12b:free"\n    assert call[1].startswith("http://litellm:4000/v1/messages")\n    assert "anthropic-beta" not in {key.lower() for key in call[2]["headers"]}\n',
              1,
          )

          rate_limit_test = '''\n\n@pytest.mark.asyncio\nasync def test_v032_chatgpt_anthropic_rate_limit_is_normalized_for_claude(client):\n    FakeAsyncClient.response = FakeResponse(\n        status=429,\n        content=b'{"error":{"message":"The usage limit has been reached","type":"throttling_error","code":"429"}}',\n        headers={"content-type": "application/json", "retry-after": "60"},\n    )\n    response = await client.post(\n        "/v1/messages",\n        json={\n            "model": "openai/gpt-5.6-luna",\n            "stream": True,\n            "messages": [{"role": "user", "content": "hello"}],\n        },\n    )\n    assert response.status_code == 429\n    assert response.json() == {\n        "type": "error",\n        "error": {\n            "type": "rate_limit_error",\n            "message": "The usage limit has been reached",\n        },\n    }\n    assert response.headers["retry-after"] == "60"\n    call = FakeAsyncClient.instances[-1].calls[0]\n    assert call[1].startswith("http://litellm-chatgpt:4000/v1/messages")\n    assert "Authorization" not in call[2]["headers"]\n'''
          insert_before = '\n\n@pytest.mark.asyncio\nasync def test_v031_api_show_uses_physical_ollama_capabilities_for_local_models'
          assert tests.count(insert_before) == 1
          tests = tests.replace(insert_before, rate_limit_test + insert_before, 1)
          test_path.write_text(tests, encoding='utf-8')

          # Documentation and release metadata.
          Path('VERSION').write_text('0.3.2\n', encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          release = '''## [0.3.2] - 2026-07-29\n\n### Fixed\n\n- Claude `/v1/messages` traffic for Ollama/Ollama Cloud/OpenRouter now bypasses Headroom and goes directly to the dedicated LiteLLM Anthropic-compatibility deployments, preventing ToolSearch beta schemas from being reintroduced downstream.\n- The gateway strips `anthropic-beta` before forwarding third-party Anthropic-surface traffic while preserving normal client-side tools and `anthropic-version`.\n- Non-2xx responses on Anthropic endpoints are normalized to Anthropic error envelopes, including HTTP 429 as `rate_limit_error`, so current Claude Code exits promptly on ChatGPT subscription usage limits.\n- Claude launcher uses `ENABLE_TOOL_SEARCH=false` and regression contracts now exercise the real HTTP proxy boundary for ToolSearch and rate-limit failures.\n\n'''
          changelog = changelog.replace('## [Unreleased]\n\n', '## [Unreleased]\n\n' + release, 1)
          changelog = changelog.replace('[Unreleased]: https://github.com/diegocofre/cofer-one-ia/compare/v0.3.1...HEAD\n', '[Unreleased]: https://github.com/diegocofre/cofer-one-ia/compare/v0.3.2...HEAD\n[0.3.2]: https://github.com/diegocofre/cofer-one-ia/compare/v0.3.1...v0.3.2\n', 1)
          Path('CHANGELOG.md').write_text(changelog, encoding='utf-8')

          replace_once(
              'docs/OLLAMA-LAUNCH.md',
              'For local Ollama, Ollama Cloud and OpenRouter, `/v1/messages` is routed to a private\n`cofer-anthropic--*` LiteLLM deployment backed by Chat Completions (`ollama_chat/*` or\n`openrouter/*`). Codex/OpenAI clients keep their separate native Responses deployments.\nThis split avoids passing Claude\'s tool definitions through the Anthropic-to-Responses\nbridge. For physical local Ollama models that do not implement thinking, Cofer also removes\nClaude\'s thinking/reasoning-effort controls before forwarding; known thinking families keep\nthem.\n',
              'For local Ollama, Ollama Cloud and OpenRouter, `/v1/messages` is routed directly to a private\n`cofer-anthropic--*` LiteLLM deployment backed by Chat Completions (`ollama_chat/*` or\n`openrouter/*`), bypassing Headroom on the Anthropic surface. The gateway removes Anthropic-only\nToolSearch/deferred-tool beta metadata and `anthropic-beta` before forwarding, while preserving\nnormal client-side tools. Codex/OpenAI clients keep their separate native Responses deployments\nand Headroom optimization. For physical local Ollama models that do not implement thinking, Cofer\nalso removes Claude\'s thinking/reasoning-effort controls before forwarding; known thinking\nfamilies keep them. Non-2xx `/v1/messages` responses are normalized to Anthropic error envelopes\nso Claude Code can classify rate limits and provider failures deterministically.\n',
          )

          replace_once(
              'ARCHITECTURE.md',
              'The gateway supports Ollama (`/api/*`), OpenAI (`/v1/chat/completions`,\n`/v1/responses`, `/v1/models`) and Anthropic (`/v1/messages`) surfaces.\n',
              'The gateway supports Ollama (`/api/*`), OpenAI (`/v1/chat/completions`,\n`/v1/responses`, `/v1/models`) and Anthropic (`/v1/messages`) surfaces. OpenAI/Ollama standard\ntraffic keeps the Headroom optimization path; Anthropic `/v1/messages` bypasses Headroom and\nuses the dedicated LiteLLM compatibility deployments so tool-schema normalization remains\ndeterministic end to end.\n',
          )
          replace_once(
              'ARCHITECTURE.md',
              '- Anthropic-surface clients such as Claude Code use a private `cofer-anthropic--*`\n  deployment backed by the provider\'s Chat Completions transport (`ollama_chat/*` or\n  `openrouter/*`). This avoids routing Claude tool schemas through the newer\n  Anthropic-to-Responses bridge while preserving native Responses for Codex.\n',
              '- Anthropic-surface clients such as Claude Code bypass Headroom and use a private\n  `cofer-anthropic--*` deployment backed by the provider\'s Chat Completions transport\n  (`ollama_chat/*` or `openrouter/*`). The gateway strips Anthropic-only beta/tool-search\n  metadata and normalizes provider failures back to Anthropic error envelopes. This avoids\n  routing Claude tool schemas through the newer Anthropic-to-Responses bridge while preserving\n  native Responses plus Headroom for Codex/OpenAI-surface clients.\n',
          )
          PY
      - name: Install test dependencies
        run: python -m pip install -e 'services/ollama-gateway[dev]' pyyaml
      - name: Compile Python
        run: python -m compileall services/ollama-gateway/app tools collama/collama_launch.py
      - name: Gateway and contract tests
        run: python -m pytest services/ollama-gateway/tests
      - name: Validate version metadata
        run: |
          test "$(cat VERSION)" = "0.3.2"
          grep -q '^## \[0.3.2\] - 2026-07-29$' CHANGELOG.md
      - name: Commit validated patch
        shell: bash
        run: |
          git rm .github/workflows/apply-v032.yml
          git config user.name "cofer-one-ia-agent"
          git config user.email "actions@users.noreply.github.com"
          git add collama/collama_launch.py services/ollama-gateway/app/upstream.py services/ollama-gateway/app/main.py services/ollama-gateway/tests/test_collama_launch.py services/ollama-gateway/tests/test_upstream_proxy.py VERSION CHANGELOG.md docs/OLLAMA-LAUNCH.md ARCHITECTURE.md
          git commit -m "fix: harden Anthropic compatibility in v0.3.2"
          git push origin HEAD:agent/v0.3.2-anthropic-fix
