name: Agent diagnose aggregate CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest-file:
    name: Diagnose / ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_app.py
          - test_app_startup.py
          - test_codex_direct.py
          - test_collama_launch.py
          - test_collama_launch_matrix.py
          - test_config_generator.py
          - test_launch_aliases.py
          - test_postgres_onboard.py
          - test_protocol_routes.py
          - test_scripts_contract.py
          - test_translation.py
          - test_upstream_proxy.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -q -e 'services/ollama-gateway[dev]' pyyaml
      - name: Run file
        run: python -m pytest "services/ollama-gateway/tests/${{ matrix.file }}" -q --tb=short
