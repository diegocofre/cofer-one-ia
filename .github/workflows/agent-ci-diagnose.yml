name: Agent diagnose aggregate CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.3.1-launch-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -q -e 'services/ollama-gateway[dev]' pyyaml
      - name: Capture aggregate pytest result
        shell: bash
        run: |
          set +e
          python -m pytest services/ollama-gateway/tests -q --tb=short > ci-full.log 2>&1
          status=$?
          echo "PYTEST_EXIT_CODE=$status" >> ci-full.log
          tail -n 160 ci-full.log
          exit 0
      - name: Publish diagnostic log to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-ci-diagnose.yml
          git add ci-full.log
          git commit -m 'chore: capture aggregate CI failure'
          git push origin HEAD:agent/v0.3.1-launch-compat
