name: Agent v0.3.1 compatibility patch

on:
  push:
    branches:
      - agent/v0.3.1-launch-compat

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e 'services/ollama-gateway[dev]' pyyaml
      - name: Apply v0.3.1 patch
        run: |
          python tools/apply-v031-patch.py
          python tools/post-v031-fix.py
      - name: Compile Python
        run: python -m compileall services/ollama-gateway/app tools collama/collama_launch.py
      - name: Run launch and protocol contracts
        run: |
          python -m pytest \
            services/ollama-gateway/tests/test_collama_launch.py \
            services/ollama-gateway/tests/test_upstream_proxy.py \
            services/ollama-gateway/tests/test_protocol_routes.py
      - name: Validate shell and Compose
        run: |
          bash -n scripts/*.sh collama/collama collama/install-collama.sh
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env -f compose.yaml -f compose.source.yaml config >/dev/null
      - name: Commit validated v0.3.1 changes
        shell: bash
        run: |
          rm -f tools/apply-v031-patch.py tools/post-v031-fix.py .github/workflows/agent-v031-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden v0.3.1 launch compatibility'
          git push origin HEAD:agent/v0.3.1-launch-compat
