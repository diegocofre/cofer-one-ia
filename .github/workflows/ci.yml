name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e 'services/ollama-gateway[dev]' pyyaml 'python-multipart>=0.0.20,<1'
      - name: Compile Python
        run: python -m compileall services/ollama-gateway/app services/cupass-bridge/app tools collama/collama_launch.py
      - name: Gateway and contract tests
        run: python -m pytest services/ollama-gateway/tests
      - name: Cofer U Pass bridge tests
        run: PYTHONPATH=services/cupass-bridge python -m pytest services/cupass-bridge/tests
      - name: Build gateway container
        run: docker build -t cofer-one-ia-gateway-ci services/ollama-gateway
      - name: Build Cofer U Pass bridge container
        run: docker build -t cofer-one-ia-cupass-bridge-ci services/cupass-bridge
      - name: Validate config generator offline
        run: |
          cp .env.example .env
          python tools/generate_litellm_config.py --env .env --allow-ollama-offline
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('config/generated/litellm.yaml').read_text())
          assert isinstance(data.get('model_list'), list)
          assert 'general_settings' in data
          PY
      - name: Validate repository version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', version), version
          changelog = Path('CHANGELOG.md').read_text()
          assert f'## [{version}] - ' in changelog
          assert 'COFER_VERSION_FILE' in Path('compose.yaml').read_text()
          PY
      - name: Validate JSON
        run: python -m json.tool config/models.json >/dev/null && python -m json.tool upstreams.lock.json >/dev/null
      - name: Validate shell syntax
        run: bash -n scripts/*.sh collama/collama collama/install-collama.sh
      - name: Validate Compose architecture
        run: |
          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env -f compose.yaml -f compose.source.yaml config >/dev/null
          python - <<'PY'
          import yaml
          from pathlib import Path
          compose = yaml.safe_load(Path('compose.yaml').read_text())
          services = compose['services']
          assert 'postgres' not in services
          assert 'volumes' not in compose or 'litellm-postgres' not in (compose.get('volumes') or {})
          assert 'cupass-bridge' in services
          assert services['cupass-bridge']['ports'][0].endswith(':4010')
          assert services['headroom-gateway']['command'][-2:] == ['--port', '8787']
          assert 'headroom-chatgpt' not in services
          assert services['headroom-codex']['command'][-2:] == ['--port', '8787']
          assert 'profiles' not in services['headroom-codex']
          assert 'OPENAI_API_KEY' not in services['headroom-codex']['environment']
          assert 'headroom-gateway:8787' in services['gateway']['environment']['GATEWAY_UPSTREAM_URL']
          assert services['gateway']['environment']['COFER_U_PASS_BRIDGE_URL'] == 'http://cupass-bridge:4010'
          assert services['gateway']['environment']['COFER_U_PASS_BRIDGE_KEY'] == '${COFER_U_PASS_BRIDGE_KEY}'
          assert 'cupass-bridge' in services['gateway']['depends_on']
          assert 'CHATGPT_GATEWAY_UPSTREAM_URL' not in services['gateway']['environment']
          assert services['gateway']['environment']['CHATGPT_LITELLM_URL'] == 'http://litellm-chatgpt:4000'
          assert services['litellm']['environment']['DATABASE_URL'] is None
          assert services['litellm']['environment']['STORE_MODEL_IN_DB'] == '${LITELLM_STORE_MODEL_IN_DB:-False}'
          assert services['litellm']['environment']['DISABLE_ADMIN_UI'] == '${LITELLM_DISABLE_ADMIN_UI:-True}'
          PY

  launch-matrix:
    name: Discover launch integrations
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.matrix.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: matrix
        name: Build client matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util
          import json
          import sys
          from pathlib import Path

          module_path = Path('collama/collama_launch.py')
          spec = importlib.util.spec_from_file_location('collama_launch_ci', module_path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          clients = sorted(module.ADAPTERS)
          assert clients, 'collama launch has no enabled integrations'
          print('clients=' + json.dumps(clients))
          PY

  launch-clients:
    name: Launch contract / ${{ matrix.client }}
    needs: launch-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.launch-matrix.outputs.clients) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install launch test dependencies
        run: python -m pip install pytest
      - name: Test collama launch adapter
        run: python -m pytest "services/ollama-gateway/tests/test_collama_launch_matrix.py::test_launch_smoke_for_every_enabled_client[${{ matrix.client }}]"

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts\*.ps1, .\collama\*.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  Write-Host "PowerShell parse errors in $($_.Name):"
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              }
          }
          if ($failed) { throw "PowerShell syntax validation failed." }
      - name: Validate Python launcher helper
        shell: pwsh
        run: |
          . .\scripts\_common.ps1
          $cmd = @(Get-PythonInvocation)
          if ($cmd.Count -lt 1) { throw "Get-PythonInvocation returned no executable." }
          Invoke-Python --version
          python -m py_compile .\collama\collama_launch.py
