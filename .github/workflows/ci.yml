name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install gateway test dependencies
        run: python -m pip install -e 'services/ollama-gateway[dev]' pyyaml
      - name: Compile Python
        run: python -m compileall services/ollama-gateway/app tools
      - name: Gateway and contract tests
        run: python -m pytest services/ollama-gateway/tests
      - name: Build gateway container
        run: docker build -t cofer-one-ia-gateway-ci services/ollama-gateway
      - name: Validate config generator offline
        run: |
          cp .env.example .env
          python tools/generate_litellm_config.py --env .env --allow-ollama-offline
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('config/generated/litellm.yaml').read_text())
          assert isinstance(data.get('model_list'), list)
          assert 'general_settings' in data
          PY
      - name: Validate JSON
        run: python -m json.tool config/models.json >/dev/null && python -m json.tool upstreams.lock.json >/dev/null
      - name: Validate shell syntax
        run: bash -n scripts/*.sh collama/collama collama/install-collama.sh
      - name: Validate Compose architecture
        run: |
          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env -f compose.yaml -f compose.source.yaml config >/dev/null
          python - <<'PY'
          import yaml
          from pathlib import Path
          compose = yaml.safe_load(Path('compose.yaml').read_text())
          services = compose['services']
          assert 'postgres' in services
          assert 'ports' not in services['postgres']
          assert services['headroom-gateway']['command'][-2:] == ['--port', '8787']
          assert services['headroom-codex']['command'][-2:] == ['--port', '8787']
          assert services['headroom-codex']['profiles'] == ['codex-direct']
          assert 'OPENAI_API_KEY' not in services['headroom-codex']['environment']
          assert 'headroom-gateway:8787' in services['gateway']['environment']['GATEWAY_UPSTREAM_URL']
          assert services['litellm']['environment']['CHATGPT_TOKEN_DIR'] == '/app/chatgpt-auth'
          PY

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts\*.ps1, .\collama\*.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  Write-Host "PowerShell parse errors in $($_.Name):"
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              }
          }
          if ($failed) { throw "PowerShell syntax validation failed." }
      - name: Validate Python launcher helper
        shell: pwsh
        run: |
          . .\scripts\_common.ps1
          $cmd = @(Get-PythonInvocation)
          if ($cmd.Count -lt 1) { throw "Get-PythonInvocation returned no executable." }
          Invoke-Python --version
