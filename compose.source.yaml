# Source-build override. Requires initialized upstream/headroom and upstream/litellm.
services:
  litellm:
    image: cofer-one-ia-litellm:source
    build:
      context: ./upstream/litellm
      dockerfile: Dockerfile

  headroom-gateway:
    image: cofer-one-ia-headroom:source
    build: &headroom-source-build
      context: ./upstream/headroom
      dockerfile: Dockerfile
      target: runtime-slim-base
      args:
        HEADROOM_BUILD_VERSION: source-build

  headroom-codex:
    image: cofer-one-ia-headroom:source
    build: *headroom-source-build
