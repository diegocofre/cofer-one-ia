name: cofer-one-ia

x-headroom-common: &headroom-common
  HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
  HEADROOM_OUTPUT_SHAPER: ${HEADROOM_OUTPUT_SHAPER:-0}
  HEADROOM_SAVINGS_PROFILE: "${HEADROOM_SAVINGS_PROFILE:-coding}"

services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.93.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # External PostgreSQL is optional. A null value is deliberate: Compose
      # resolves DATABASE_URL from .env/shell when configured and removes it
      # from the container environment entirely when it is not configured.
      DATABASE_URL:
      STORE_MODEL_IN_DB: ${LITELLM_STORE_MODEL_IN_DB:-False}
      DISABLE_ADMIN_UI: ${LITELLM_DISABLE_ADMIN_UI:-True}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      OLLAMA_BACKEND_URL: ${OLLAMA_BACKEND_URL:-http://host.docker.internal:11435}
      OLLAMA_OPENAI_BASE_URL: ${OLLAMA_OPENAI_BASE_URL:-http://host.docker.internal:11435/v1}
    volumes:
      - ./config/generated/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Dedicated ChatGPT-subscription LiteLLM instance. It intentionally has no
  # proxy master key so the proxy credential can never override the OAuth
  # Authorization header generated by LiteLLM's ChatGPT authenticator.
  litellm-chatgpt:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.93.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      CHATGPT_TOKEN_DIR: /app/chatgpt-auth
      STORE_MODEL_IN_DB: "False"
      DISABLE_ADMIN_UI: "True"
    volumes:
      - ./config/generated/litellm-chatgpt.yaml:/app/config.yaml:ro
      - ./data/litellm/chatgpt:/app/chatgpt-auth
    ports:
      - "127.0.0.1:${LITELLM_CHATGPT_PORT:-4001}:4000"
    restart: unless-stopped

  # One client-neutral Headroom instance for all normal traffic.
  headroom-gateway:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.32.0}
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      <<: *headroom-common
      OPENAI_TARGET_API_URL: http://litellm:4000
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/gateway:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_GATEWAY_PORT:-8790}:8787"
    depends_on:
      - litellm
    networks:
      default:
        aliases:
          # v0.1.x compatibility for an existing GATEWAY_UPSTREAM_URL.
          - headroom-cline
    restart: unless-stopped

  gateway:
    build:
      context: ./services/ollama-gateway
    environment:
      GATEWAY_UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:-http://headroom-gateway:8787}
      LITELLM_URL: http://litellm:4000
      CHATGPT_LITELLM_URL: http://litellm-chatgpt:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-600}
      GATEWAY_MODEL_REFRESH_SECONDS: ${GATEWAY_MODEL_REFRESH_SECONDS:-15}
      GATEWAY_DEFAULT_CONTEXT_LENGTH: ${GATEWAY_DEFAULT_CONTEXT_LENGTH:-32768}
      COFER_VERSION_FILE: /app/cofer-version/VERSION
    volumes:
      - ./VERSION:/app/cofer-version/VERSION:ro
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_PORT:-11434}:11434"
    depends_on:
      - litellm
      - litellm-chatgpt
      - headroom-gateway
    restart: unless-stopped

  # Always-on escape hatch: the proxy stays ready, while using the cofer-direct
  # Codex profile remains explicitly opt-in. No LiteLLM key or ChatGPT token is
  # shared into this path.
  headroom-codex:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.32.0}
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      <<: *headroom-common
      OPENAI_TARGET_API_URL: ${CODEX_CHATGPT_BASE_URL:-https://chatgpt.com/backend-api/codex}
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/codex:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_CODEX_PORT:-8787}:8787"
    restart: unless-stopped
