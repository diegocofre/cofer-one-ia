name: cofer-one-ia

x-headroom-env: &headroom-env
  OPENAI_TARGET_API_URL: http://litellm:4000
  OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
  HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
  HEADROOM_OUTPUT_SHAPER: ${HEADROOM_OUTPUT_SHAPER:-0}
  HEADROOM_SAVINGS_PROFILE: "${HEADROOM_SAVINGS_PROFILE:-balanced}"

services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.93.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BACKEND_URL: ${OLLAMA_BACKEND_URL:-http://host.docker.internal:11435}
    volumes:
      - ./config/generated/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  headroom-cline:
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    command: ["--host", "0.0.0.0", "--port", "8790"]
    environment:
      <<: *headroom-env
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/cline:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_CLINE_PORT:-8790}:8790"
    depends_on:
      - litellm
    restart: unless-stopped

  gateway:
    build:
      context: ./services/ollama-gateway
    environment:
      GATEWAY_UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:-http://headroom-cline:8790}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-600}
      GATEWAY_MODEL_REFRESH_SECONDS: ${GATEWAY_MODEL_REFRESH_SECONDS:-15}
      GATEWAY_DEFAULT_CONTEXT_LENGTH: ${GATEWAY_DEFAULT_CONTEXT_LENGTH:-32768}
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_PORT:-11434}:11434"
    depends_on:
      - litellm
      - headroom-cline
    restart: unless-stopped

  headroom-codex:
    profiles: ["all-clients"]
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      <<: *headroom-env
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/codex:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_CODEX_PORT:-8787}:8787"
    depends_on: [litellm]
    restart: unless-stopped

  headroom-opencode:
    profiles: ["all-clients"]
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    command: ["--host", "0.0.0.0", "--port", "8788"]
    environment:
      <<: *headroom-env
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/opencode:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_OPENCODE_PORT:-8788}:8788"
    depends_on: [litellm]
    restart: unless-stopped

  headroom-zcode:
    profiles: ["all-clients"]
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    command: ["--host", "0.0.0.0", "--port", "8789"]
    environment:
      <<: *headroom-env
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/zcode:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_ZCODE_PORT:-8789}:8789"
    depends_on: [litellm]
    restart: unless-stopped

  headroom-continue:
    profiles: ["all-clients"]
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    command: ["--host", "0.0.0.0", "--port", "8791"]
    environment:
      <<: *headroom-env
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/continue:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_CONTINUE_PORT:-8791}:8791"
    depends_on: [litellm]
    restart: unless-stopped
