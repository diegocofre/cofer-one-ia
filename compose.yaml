name: cofer-one-ia

x-headroom-common: &headroom-common
  HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
  HEADROOM_OUTPUT_SHAPER: ${HEADROOM_OUTPUT_SHAPER:-0}
  HEADROOM_SAVINGS_PROFILE: "${HEADROOM_SAVINGS_PROFILE:-coding}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cupass-bridge:
    build:
      context: ./services/cupass-bridge
    environment:
      CUPASS_BRIDGE_API_KEY: ${COFER_U_PASS_BRIDGE_KEY}
      CUPASS_BRIDGE_DATA_ROOT: /data
      CUPASS_BRIDGE_REQUEST_TIMEOUT_SECONDS: ${COFER_U_PASS_REQUEST_TIMEOUT_SECONDS:-1800}
      CUPASS_BRIDGE_WORKER_POLL_SECONDS: ${COFER_U_PASS_WORKER_POLL_SECONDS:-25}
      CUPASS_BRIDGE_WORKER_STALE_SECONDS: ${COFER_U_PASS_WORKER_STALE_SECONDS:-90}
      CUPASS_BRIDGE_MAX_FILE_BYTES: ${COFER_U_PASS_MAX_FILE_BYTES:-524288000}
    volumes:
      - ./data/cupass-bridge:/data
    ports:
      - "127.0.0.1:${COFER_U_PASS_BRIDGE_PORT:-4011}:4010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:4010/health',headers={'Authorization':'Bearer '+os.environ['CUPASS_BRIDGE_API_KEY']}); urllib.request.urlopen(r,timeout=3).read()\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.93.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BACKEND_URL: ${OLLAMA_BACKEND_URL:-http://host.docker.internal:11435}
      CHATGPT_TOKEN_DIR: /app/chatgpt-auth
      COFER_U_PASS_BRIDGE_URL: http://cupass-bridge:4010/v1
      COFER_U_PASS_BRIDGE_KEY: ${COFER_U_PASS_BRIDGE_KEY}
    volumes:
      - ./config/generated/litellm.yaml:/app/config.yaml:ro
      - ./data/litellm/chatgpt:/app/chatgpt-auth
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      cupass-bridge:
        condition: service_healthy
    restart: unless-stopped

  headroom-gateway:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.32.0}
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      <<: *headroom-common
      OPENAI_TARGET_API_URL: http://litellm:4000
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/gateway:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_GATEWAY_PORT:-8790}:8787"
    depends_on:
      - litellm
    networks:
      default:
        aliases:
          - headroom-cline
    restart: unless-stopped

  gateway:
    build:
      context: ./services/ollama-gateway
    environment:
      GATEWAY_UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:-http://headroom-gateway:8787}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      COFER_U_PASS_BRIDGE_URL: http://cupass-bridge:4010
      COFER_U_PASS_BRIDGE_KEY: ${COFER_U_PASS_BRIDGE_KEY}
      GATEWAY_MODEL_CATALOG: /app/model-catalog.json
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-600}
      GATEWAY_MODEL_REFRESH_SECONDS: ${GATEWAY_MODEL_REFRESH_SECONDS:-15}
      GATEWAY_DEFAULT_CONTEXT_LENGTH: ${GATEWAY_DEFAULT_CONTEXT_LENGTH:-32768}
    volumes:
      - ./config/generated/model-catalog.json:/app/model-catalog.json:ro
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_PORT:-11434}:11434"
    depends_on:
      - litellm
      - headroom-gateway
      - cupass-bridge
    restart: unless-stopped

  headroom-codex:
    profiles: ["codex-direct"]
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.32.0}
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      <<: *headroom-common
      OPENAI_TARGET_API_URL: ${CODEX_CHATGPT_BASE_URL:-https://chatgpt.com/backend-api/codex}
      HEADROOM_SAVINGS_PATH: /home/nonroot/.headroom/proxy_savings.json
    volumes:
      - ./data/headroom/codex:/home/nonroot/.headroom
    ports:
      - "127.0.0.1:${HEADROOM_CODEX_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  litellm-postgres:
